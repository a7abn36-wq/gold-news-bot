# ⚡ بوت أخبار الدهب والدولار — تشغيل مجاني 24/7 على GitHub Actions
# ------------------------------------------------------------------
# طريقة التشغيل: سلسلة ذاتية الاستمرار
#   كل دورة بتشغّل البوت، وبعدين (بعد استراحة 120 ثانية) بتدعّي الدورة اللي بعدها.
#   حارس التفرّع: مفيش دورة بتعيّي دورة جديدة لو فيه تشغيل تاني شغال أو في طابور،
#   فعدد السلاسل بيفضل 1 دايماً مهما زادت التشغيلات اليدوية أو المجدولة.
#   الجدولة cron الأصلية شغالة برضه كاحتياطي (نفس الحارس بيمنع أي تزاحم).
#
# ملاحظات مهمة:
# - الريبو Public (عشان دقائق الـ Actions مجانية بلا حدود)
# - Secrets: TELEGRAM_TOKEN + CHANNEL_ID + GH_PAT (مخصص تحريك السلسلة)
# - تجربة يدوية: Actions → Gold News Bot → Run workflow
# - لو GH_PAT انتهت صلاحيتها السلسلة بتقف: جدّد التوكن وحدّث الـ Secret

name: Gold News Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # احتياطي — الحارس بيفضل سلسلة واحدة بس
  workflow_dispatch:          # التشغيل اليدوي (بيشغّل السلسلة كمان)

concurrency:
  group: gold-news-bot        # ممنوع تشغيلين في نفس الوقت
  cancel-in-progress: false

permissions:
  contents: write             # عشان البوت يحفظ الحالة في برانش bot-state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ تحميل الكود
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 تجهيز بايثون (مع كاش للمكتبات)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: 📦 تنصيب المكتبات
        run: pip install --quiet -r requirements-actions.txt

      - name: 🤖 تشغيل دورة البوت
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python gh_bot.py

      - name: 🔁 تحريك الدورة الجاية (سلسلة ذاتية الاستمرار)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          REPO="${{ github.repository }}"
          ME="${{ github.run_id }}"
          ACTIVE=$(curl -sS -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=30" \
            | python3 -c "import json,sys
          d=json.load(sys.stdin)
          me=int('$ME')
          print(sum(1 for r in d.get('workflow_runs',[]) if r['id']!=me and r['status'] in ('queued','in_progress')))" ) || ACTIVE="0"
          echo "other active runs: $ACTIVE"
          if [ "$ACTIVE" != "0" ]; then
            echo "another run is fueling the chain — no re-dispatch needed"
            exit 0
          fi
          sleep 120
          HTTP=$(curl -sS --fail -o /tmp/dispatch_body.txt -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}') || { echo "DISPATCH FAILED:"; cat /tmp/dispatch_body.txt; exit 1; }
          echo "next cycle dispatched (HTTP $HTTP)"
