# ⚡ بوت أخبار الدهب والدولار — تشغيل مجاني 24/7 على GitHub Actions
# ------------------------------------------------------------------
# طريقة التشغيل: سلسلة ذاتية الاستمرار + حارس ذكي (chain_keeper.py)
#   كل دورة بتشغّل البوت، وبعدين الحارس الذكي بيتكفل بالدورة الجاية
#   بمنطق "آخر واحد ياخد العصا": آخر تشغيل بستنّى وبدوّر اللي بعده
#   بإعادة محاولة 5 مرات — فشل عابر أو تشغيل متعلق مش بيقدروا يوقفوه.
#   الجدولة cron الأصلية شغالة برضه كاحتياطي (نفس الـ concurrency بيفضل سلسلة واحدة).
#
# ملاحظات مهمة:
# - الريبو Public (عشان دقائق الـ Actions مجانية بلا حدود)
# - Secrets: TELEGRAM_TOKEN + CHANNEL_ID + GH_PAT (مخصص تحريك السلسلة)
# - تجربة يدوية: Actions → Gold News Bot → Run workflow
# - لو GH_PAT انتهت صلاحيتها السلسلة بتقف: جدّد التوكن وحدّث الـ Secret

name: Gold News Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # احتياطي — الحارس بيفضل سلسلة واحدة بس
  workflow_dispatch:          # التشغيل اليدوي (بيشغّل السلسلة كمان)

concurrency:
  group: gold-news-bot        # ممنوع تشغيلين في نفس الوقت
  cancel-in-progress: false

permissions:
  contents: write             # عشان البوت يحفظ الحالة في برانش bot-state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ تحميل الكود
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 تجهيز بايثون (مع كاش للمكتبات)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: 📦 تنصيب المكتبات
        run: pip install --quiet -r requirements-actions.txt

      - name: 🤖 تشغيل دورة البوت
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python gh_bot.py

      - name: 🔁 حارس السلسلة الذكي (إصلاح ذاتي + إعادة محاولة)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 chain_keeper.py
